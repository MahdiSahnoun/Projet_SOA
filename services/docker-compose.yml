name: projet_soa
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dons_db
      POSTGRES_USER: ${DB_USER:-dons_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dons:
    build:
      context: .
      dockerfile: dons/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dons_db
      DB_USER: ${DB_USER:-dons_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      COMPTES_TEST_MDP: ${COMPTES_TEST_MDP:-}
      INVENTAIRE_GRPC_ADDRESS: ${INVENTAIRE_GRPC_ADDRESS:-static://host.docker.internal:9090}
      REGISTRE_URL: ${REGISTRE_URL:-http://host.docker.internal:8083/ws}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
