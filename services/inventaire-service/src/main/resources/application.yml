spring:
  application:
    name: inventaire-service
  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/inventaire_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    # Crée les tables avant d'exécuter data.sql
    defer-datasource-initialization: true
  # data.sql (banques et poches de démo) chargé même sans Config Server ;
  # rejouable sans risque : chaque INSERT se termine par ON CONFLICT DO NOTHING
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}
    reflection-service-enabled: true
    security:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
inventaire:
  stock-critique-seuil: ${INVENTAIRE_STOCK_CRITIQUE_SEUIL:3}
