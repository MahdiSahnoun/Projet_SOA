# ----------------------------------------------------------------
# Extrait à intégrer dans le docker-compose.yml principal
# avec l'accord de P1 (responsable du Compose).
# ----------------------------------------------------------------

# Ajouter dans la section "services:" :

  registre_db:
    container_name: registre_pg_sql
    image: postgres:16
    environment:
      POSTGRES_DB: registre_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    volumes:
      - registre_postgres:/data/postgres
    ports:
      - "5434:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  registre-service:
    container_name: registre-service
    build:
      context: .
      dockerfile: services/registre-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://registre_db:5432/registre_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery:8761/eureka/
    depends_on:
      - registre_db
      - config-server
      - discovery
    networks:
      - microservices-net
    restart: unless-stopped

# Ajouter dans la section "volumes:" :
#   registre_postgres:
