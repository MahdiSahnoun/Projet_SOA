spring:
  application:
    name: notification-service
  config:
    import: "${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}"
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    consumer:
      group-id: "${NOTIFICATION_KAFKA_GROUP:notification-service}"
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  mail:
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1025}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    properties:
      mail:
        smtp:
          auth: "${MAIL_SMTP_AUTH:false}"
          starttls:
            enable: "${MAIL_SMTP_STARTTLS:false}"

server:
  port: "${SERVER_PORT:8084}"

app:
  kafka:
    email-topic: "${NOTIFICATION_EMAIL_TOPIC:notifications.email}"
  mail:
    from: "${MAIL_FROM:no-reply@donsang.local}"

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}"
  instance:
    hostname: "${EUREKA_INSTANCE_HOSTNAME:localhost}"

management:
  endpoints:
    web:
      exposure:
        include: health,info
