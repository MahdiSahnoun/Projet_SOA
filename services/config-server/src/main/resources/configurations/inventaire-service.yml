grpc:
  server:
    port: 9090
    reflection-service-enabled: true
    security:
      enabled: false

server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/inventaire_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    non-secure-port: 8080
    # Pas d'URL écrite en dur : Eureka construit status/health/home à partir de hostname

inventaire:
  stock-critique-seuil: ${INVENTAIRE_STOCK_CRITIQUE_SEUIL:3}
  stock-alert-recipient: ${INVENTAIRE_STOCK_ALERT_RECIPIENT:stock-alerts@donsang.local}

app:
  kafka:
    email-topic: ${NOTIFICATION_EMAIL_TOPIC:notifications.email}
