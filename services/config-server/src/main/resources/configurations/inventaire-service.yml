grpc:
  server:
    port: 9090
    reflection-service-enabled: true
    security:
      enabled: false

server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/inventaire_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
    non-secure-port: 8080
    status-page-url: http://localhost:8080/actuator/info
    home-page-url: http://localhost:8080/
    health-check-url: http://localhost:8080/actuator/health

inventaire:
  stock-critique-seuil: ${INVENTAIRE_STOCK_CRITIQUE_SEUIL:3}
